<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こべっこゲームズ</title>
<meta name="description" content="こべっこどうぶつの小さなブラウザゲーム置き場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--night:#121a30;--ink:#f3ead8;--dim:#a9a3b8;--buoy:#e8473a;--panel:#1a1f36;--edge:#000;
  --dot:"DotGothic16","Hiragino Sans","Noto Sans JP",monospace;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--dot);
  padding:32px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto}
h1{font-weight:400;font-size:28px;margin:0 0 6px;letter-spacing:.06em}
h1 span{color:var(--buoy)}
.lead{color:var(--dim);margin:0 0 28px;font-size:14px}
.games{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.game{display:block;background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--edge);padding:16px 18px;color:inherit;text-decoration:none}
.game:hover{border-color:var(--buoy)}
.game:focus-visible{outline:2px solid var(--buoy);outline-offset:4px}
.game h2{font-weight:400;font-size:20px;margin:0 0 4px}
.game p{margin:0;color:var(--dim);font-size:13px;line-height:1.6}
.tag{display:inline-block;margin-top:10px;font-size:11px;color:var(--night);background:#f2a660;padding:2px 6px}
footer{margin-top:36px;color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>こべっこ<span>ゲームズ</span></h1>
  <p class="lead">ブラウザですぐ遊べる小さなゲーム置き場。</p>
  <ul class="games">
    <li>
      <a class="game" href="./pier60/">
        <h2>60秒防波堤</h2>
        <p>夕まずめの神戸の波止で、しょぼつりくんが60秒間の釣りに挑戦。合計何グラム釣れるか。</p>
        <span class="tag">釣り / ワンボタン</span>
      </a>
    </li>
  </ul>
  <footer>
    <a href="https://x.com/kobekko" target="_blank" rel="noopener">X @kobekko</a>
    <a href="https://www.youtube.com/@syobo_fishing" target="_blank" rel="noopener">しょぼ釣りチャンネル</a>
  </footer>
</main>
</body>
</html>
